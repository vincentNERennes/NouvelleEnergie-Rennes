<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Énergisons Rennes - Signalements</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Sidebar par défaut (Bureau) */
        #sidebar {
            width: 400px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            z-index: 1000;
            height: 100vh;
        }

        .header {
            padding: 15px 20px;
            background: #1a1b41;
            color: white;
            text-align: center;
        }

        .header img {
            max-height: 50px;
            width: auto;
            margin-bottom: 6px;
            object-fit: contain;
        }

        .header p {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #dcdde1;
        }

        .tabs {
            display: flex;
            background: #34495e;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .tab-btn.active {
            background: #2980b9;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            display: block;
        }

        input[type="text"], input[type="password"], textarea, input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #2980b9;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2471a3;
        }

        /* Liste des signalements */
        .signal-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 5px solid #f39c12;
        }

        .signal-card.validated {
            border-left-color: #27ae60;
        }

        .signal-card.resolved {
            border-left-color: #2980b9;
        }

        .signal-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 6px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-action {
            padding: 6px 8px;
            font-size: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-validate { background: #27ae60; }
        .btn-resolve { background: #2980b9; }
        .btn-delete { background: #c0392b; margin-left: auto; }

        #map {
            flex: 1;
            width: 100%;
            height: 100vh;
        }

        .sync-status {
            font-size: 0.7rem;
            color: #f1c40f;
            text-align: center;
            padding: 4px;
            background: #1a252f;
        }

        /* Bouton pour basculer la vue sur mobile */
        .mobile-toggle-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            background: #1a1b41;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        /* Bouton de géolocalisation sur la carte */
        .geo-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .geo-btn:hover {
            background: #f4f6f9;
        }

        /* ================= MEDIA QUERIES (OPTIMISATION MOBILE) ================= */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: 45vh;
                position: absolute;
                bottom: 0;
                left: 0;
                transition: transform 0.3s ease-in-out;
                z-index: 3000;
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
                box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            }

            #sidebar.minimized {
                transform: translateY(calc(100% - 50px));
            }

            #map {
                height: 100vh;
                width: 100vw;
            }

            .mobile-toggle-btn {
                display: block;
            }

            .geo-btn {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Bouton flottant mobile pour ouvrir/fermer le panneau -->
    <button class="mobile-toggle-btn" id="toggle-btn" onclick="toggleMobileSidebar()">📜 Panneau / Formulaire</button>

    <!-- Bouton de géolocalisation sur la carte -->
    <button class="geo-btn" onclick="locateUser()" title="Me géolocaliser">📍</button>

    <div id="sidebar">
        <!-- En-tête avec logo et mention Énergisons Rennes -->
        <div class="header">
            <img src="logo.png" alt="Logo Nouvelle Énergie">
            <p>Énergisons Rennes</p>
        </div>
        <div id="sync-status" class="sync-status">🔄 Connexion...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('citizen')">📢 Signaler</button>
            <button class="tab-btn" onclick="switchTab('admin')">🔒 Admin</button>
        </div>

        <!-- Onglet Citoyen -->
        <div id="tab-citizen" class="tab-content active">
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
                1. Décrivez le problème.<br>2. Prenez/choisissez une photo.<br>3. <b>Cliquez sur l'endroit exact sur la carte.</b>
            </p>
            <label for="sig-desc">Description :</label>
            <textarea id="sig-desc" rows="2" placeholder="Ex: Tag, abribus cassé..."></textarea>

            <label for="sig-photo">Photo :</label>
            <input type="file" id="sig-photo" accept="image/*">

            <div style="background: #e8f8f5; padding: 8px; border-radius: 6px; font-size: 0.75rem; color: #16a085; margin-top: 5px;">
                ℹ️ Votre signalement sera soumis à validation avant d'apparaître sur la carte.
            </div>
        </div>

        <!-- Onglet Admin -->
        <div id="tab-admin" class="tab-content">
            <div id="admin-login">
                <label for="admin-pass">Mot de passe admin :</label>
                <input type="password" id="admin-pass" placeholder="Mot de passe">
                <button class="btn-primary" onclick="checkAdmin()">Se connecter</button>
            </div>

            <div id="admin-panel" style="display:none;">
                <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: #2c3e50;">Modération</h3>
                <div id="admin-list"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BIN_ID = "6ae3ce5bffd5d16053971b9e";
        const API_KEY = "$2a$10$CgKC3W5/qiItbMUXH6igROL45Kq7W1XE33Mpx7VIplJ87fKCP9Csa";
        const ADMIN_PASSWORD = "rennes";

        const map = L.map('map').setView([48.117266, -1.677792], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France'
        }).addTo(map);

        let signalsData = [];
        let markersMap = {};
        let isAdminLoggedIn = false;
        let isSidebarOpen = true;
        let userMarker = null;

        function locateUser() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    map.setView([lat, lng], 17);

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    // Ajout d'un marqueur distinctif pour la position de l'utilisateur
                    const userIconHtml = `<div style="background:#3498db; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.4);"></div>`;
                    const userIcon = L.divIcon({ html: userIconHtml, className: '', iconSize: [18, 18] });

                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("<b>Vous êtes ici 📍</b>").openPopup();
                },
                () => {
                    alert("Impossible de récupérer votre position. Vérifiez vos paramètres GPS.");
                },
                { enableHighAccuracy: true }
            );
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('minimized');
                document.getElementById('toggle-btn').innerText = '🔽 Masquer panneau';
            } else {
                sidebar.classList.add('minimized');
                document.getElementById('toggle-btn').innerText = '📜 Ouvrir panneau / formulaire';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'citizen') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-citizen').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-admin').classList.add('active');
            }
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('minimized');
            isSidebarOpen = true;
            document.getElementById('toggle-btn').innerText = '🔽 Masquer panneau';
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                renderAdminList();
            } else {
                alert("Mot de passe incorrect.");
            }
        }

        map.on('click', function(e) {
            const desc = document.getElementById('sig-desc').value.trim();
            const fileInput = document.getElementById('sig-photo');

            if (!desc) {
                alert("Veuillez d'abord saisir une description.");
                switchTab('citizen');
                return;
            }

            if (fileInput.files.length === 0) {
                alert("Veuillez ajouter une photo.");
                switchTab('citizen');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    const newSignal = {
                        id: Date.now(),
                        lat: e.latlng.lat,
                        lng: e.latlng.lng,
                        desc: desc,
                        photoBefore: compressedDataUrl,
                        photoAfter: null,
                        status: 'pending',
                        dateAdded: new Date().toLocaleDateString('fr-FR')
                    };

                    signalsData.push(newSignal);
                    saveToCloud();

                    document.getElementById('sig-desc').value = '';
                    fileInput.value = '';
                    alert("Signalement envoyé avec succès ! En attente de validation.");
                    
                    if (window.innerWidth <= 768) {
                        toggleMobileSidebar();
                    }
                };
            };
            reader.readAsDataURL(file);
        });

        async function fetchFromCloud() {
            document.getElementById('sync-status').innerText = '🔄 Synchro...';
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                signalsData = data.record.signals || [];
                renderMapAndAdmin();
                document.getElementById('sync-status').innerText = '✅ À jour';
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText = '⚠️ Erreur synchro';
            }
        }

        async function saveToCloud() {
            document.getElementById('sync-status').innerText = '⏳ Sauvegarde...';
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ signals: signalsData })
                });
                document.getElementById('sync-status').innerText = '✅ Sauvegardé';
                renderMapAndAdmin();
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText = '⚠️ Erreur sauvegarde';
            }
        }

        function updateSignalStatus(id, newStatus) {
            const sig = signalsData.find(s => s.id === id);
            if (sig) {
                sig.status = newStatus;
                saveToCloud();
            }
        }

        function addAfterPhoto(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * (MAX_WIDTH / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const sig = signalsData.find(s => s.id === id);
                        if (sig) {
                            sig.photoAfter = canvas.toDataURL('image/jpeg', 0.7);
                            sig.status = 'resolved';
                            saveToCloud();
                        }
                    };
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function deleteSignal(id) {
            if (confirm("Supprimer ce signalement ?")) {
                signalsData = signalsData.filter(s => s.id !== id);
                saveToCloud();
            }
        }

        function renderMapAndAdmin() {
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {};

            signalsData.forEach(sig => {
                if (sig.status !== 'pending' || isAdminLoggedIn) {
                    let color = '#f39c12';
                    if (sig.status === 'validated') color = '#27ae60';
                    if (sig.status === 'resolved') color = '#2980b9';

                    const iconHtml = `<div style="background:${color}; width:28px; height:28px; border-radius:50%; text-align:center; line-height:28px; color:white; font-size:13px; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3);">📷</div>`;
                    const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [28, 28] });

                    let imgContainer = `<div style="margin-top:6px;"><p><b>Avant :</b></p><img src="${sig.photoBefore}" style="width:100%; height:100px; object-fit:cover; border-radius:4px;"></div>`;
                    if (sig.photoAfter) {
                        imgContainer += `<div style="margin-top:6px;"><p><b>Après Lisnardisation :</b></p><img src="${sig.photoAfter}" style="width:100%; height:100px; object-fit:cover; border-radius:4px;"></div>`;
                    }

                    const popupHtml = `
                        <div style="max-width: 180px;">
                            <span style="font-size:0.7rem; font-weight:bold; color:${color};">[${sig.status.toUpperCase()}]</span>
                            <p style="margin: 4px 0; font-size: 0.85rem;">${sig.desc}</p>
                            ${imgContainer}
                        </div>
                    `;

                    const marker = L.marker([sig.lat, sig.lng], { icon: customIcon }).addTo(map);
                    marker.bindPopup(popupHtml);
                    markersMap[sig.id] = marker;
                }
            });

            if (isAdminLoggedIn) {
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';

            if (signalsData.length === 0) {
                list.innerHTML = '<p style="color:#888; font-size:0.85rem;">Aucun signalement.</p>';
                return;
            }

            signalsData.slice().reverse().forEach(sig => {
                const card = document.createElement('div');
                card.className = `signal-card ${sig.status}`;
                
                let actions = '';
                if (sig.status === 'pending') {
                    actions += `<button class="btn-action btn-validate" onclick="updateSignalStatus(${sig.id}, 'validated')">Valider</button>`;
                }
                if (sig.status !== 'resolved') {
                    actions += `<button class="btn-action btn-resolve" onclick="addAfterPhoto(${sig.id})">Ajouter Après</button>`;
                }
                actions += `<button class="btn-action btn-delete" onclick="deleteSignal(${sig.id})">Supprimer</button>`;

                card.innerHTML = `
                    <p style="font-size:0.75rem; color:#666;">Statut : <b>${sig.status}</b> (${sig.dateAdded})</p>
                    <p style="margin: 4px 0; font-weight:600; font-size:0.85rem;">${sig.desc}</p>
                    <img src="${sig.photoBefore}" alt="Avant">
                    ${sig.photoAfter ? '<p style="margin-top:4px; font-size:0.75rem; font-weight:bold; color:#2980b9;">Photo "Après Lisnardisation" ajoutée ✅</p>' : ''}
                    <div class="card-actions">${actions}</div>
                `;
                list.appendChild(card);
            });
        }

        fetchFromCloud();
        setInterval(fetchFromCloud, 15000);
    </script>
</body>
</html>
