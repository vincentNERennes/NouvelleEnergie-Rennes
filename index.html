<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Énergisons Rennes - Actions de Terrain</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        #sidebar {
            width: 400px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            z-index: 1000;
            height: 100vh;
        }

        .header {
            padding: 15px 20px;
            background: #1a1b41;
            color: white;
            text-align: center;
        }

        .header img {
            max-height: 50px;
            width: auto;
            margin-bottom: 6px;
            object-fit: contain;
        }

        .header p {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #dcdde1;
        }

        .tabs {
            display: flex;
            background: #34495e;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .tab-btn.active {
            background: #2980b9;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            display: block;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #2980b9;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2471a3;
        }

        .btn-warning {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-warning:hover {
            background: #d35400;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .ping-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 5px solid #e74c3c;
        }

        .ping-card.assigned {
            border-left-color: #27ae60;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100vh;
        }

        .sync-status {
            font-size: 0.7rem;
            color: #f1c40f;
            text-align: center;
            padding: 4px;
            background: #1a252f;
        }

        .mobile-toggle-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            background: #1a1b41;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .geo-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .geo-btn:hover {
            background: #f4f6f9;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: 45vh;
                position: absolute;
                bottom: 0;
                left: 0;
                transition: transform 0.3s ease-in-out;
                z-index: 3000;
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
                box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            }

            #sidebar.minimized {
                transform: translateY(calc(100% - 50px));
            }

            #map {
                height: 100vh;
                width: 100vw;
            }

            .mobile-toggle-btn {
                display: block;
            }

            .geo-btn {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <button class="mobile-toggle-btn" id="toggle-btn" onclick="toggleMobileSidebar()">📜 Panneau / Action</button>
    <button class="geo-btn" onclick="locateUser()" title="Me géolocaliser">📍</button>

    <div id="sidebar">
        <div class="header">
            <img src="logo.png" alt="Logo Nouvelle Énergie">
            <p>Énergisons Rennes</p>
        </div>
        <div id="sync-status" class="sync-status">🔄 Connexion...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('action')">🎯 Action</button>
            <button class="tab-btn" onclick="switchTab('admin')">🔒 Admin</button>
        </div>

        <div id="tab-action" class="tab-content active">
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
                1. Indiquez votre pseudo.<br>
                2. Géolocalisez-vous à l'aide du bouton 📍 en haut à droite.<br>
                3. <b>Cliquez sur la carte pour vous placer.</b>
            </p>
            <label for="user-pseudo">Votre pseudo :</label>
            <input type="text" id="user-pseudo" placeholder="Ex: Jean_NE">
        </div>

        <div id="tab-admin" class="tab-content">
            <div id="admin-login">
                <label for="admin-pass">Mot de passe admin :</label>
                <input type="password" id="admin-pass" placeholder="Mot de passe">
                <button class="btn-primary" onclick="checkAdmin()">Se connecter</button>
            </div>

            <div id="admin-panel" style="display:none;">
                <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: #2c3e50;">Gestion des trajets</h3>
                <p style="font-size: 0.75rem; color: #666; margin-bottom: 10px;">Cliquez sur un marqueur sur la carte pour basculer sa couleur.</p>
                <button class="btn-warning" onclick="resetAllPings()">🔄 Remettre tous les pings en rouge</button>
                <div id="admin-list" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BIN_ID = "6ae3ce5bffd5d16053971b9e";
        const API_KEY = "$2a$10$CgKC3W5/qiItbMUXH6igROL45Kq7W1XE33Mpx7VIplJ87fKCP9Csa";
        const ADMIN_PASSWORD = "rennes";

        const map = L.map('map').setView([48.117266, -1.677792], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France'
        }).addTo(map);

        let pingsData = [];
        let markersMap = {};
        let isAdminLoggedIn = false;
        let isSidebarOpen = true;
        let userMarker = null;

        function locateUser() {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 17);

                    if (userMarker) map.removeLayer(userMarker);
                    const userIconHtml = `<div style="background:#3498db; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.4);"></div>`;
                    userMarker = L.marker([lat, lng], { icon: L.divIcon({ html: userIconHtml, className: '', iconSize: [18, 18] }) }).addTo(map);
                    userMarker.bindPopup("<b>Vous êtes ici 📍</b>").openPopup();
                },
                () => { alert("Impossible de récupérer votre position."); },
                { enableHighAccuracy: true }
            );
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('minimized');
                document.getElementById('toggle-btn').innerText = '🔽 Masquer';
            } else {
                sidebar.classList.add('minimized');
                document.getElementById('toggle-btn').innerText = '📜 Ouvrir';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'action') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-action').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-admin').classList.add('active');
            }
            document.getElementById('sidebar').classList.remove('minimized');
            isSidebarOpen = true;
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                renderMapAndAdmin();
            } else {
                alert("Mot de passe incorrect.");
            }
        }

        map.on('click', function(e) {
            const pseudo = document.getElementById('user-pseudo').value.trim();

            if (!pseudo) {
                alert("Veuillez renseigner votre pseudo.");
                switchTab('action');
                return;
            }

            const newPing = {
                id: Date.now(),
                lat: e.latlng.lat,
                lng: e.latlng.lng,
                pseudo: pseudo,
                status: 'pending',
                dateAdded: new Date().toLocaleDateString('fr-FR')
            };

            pingsData.push(newPing);
            saveToCloud();

            alert("Position enregistrée sur la carte !");
            
            if (window.innerWidth <= 768) {
                toggleMobileSidebar();
            }
        });

        async function fetchFromCloud() {
            document.getElementById('sync-status').innerText = '🔄 Synchro...';
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                pingsData = data.record.pings || [];
                renderMapAndAdmin();
                document.getElementById('sync-status').innerText = '✅ À jour';
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText = '⚠️ Erreur synchro';
            }
        }

        async function saveToCloud() {
            document.getElementById('sync-status').innerText = '⏳ Sauvegarde...';
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ pings: pingsData })
                });
                document.getElementById('sync-status').innerText = '✅ Sauvegardé';
                renderMapAndAdmin();
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText = '⚠️ Erreur sauvegarde';
            }
        }

        function togglePingStatus(id) {
            if (!isAdminLoggedIn) return;
            const ping = pingsData.find(p => p.id === id);
            if (ping) {
                ping.status = ping.status === 'pending' ? 'assigned' : 'pending';
                saveToCloud();
            }
        }

        function deletePing(id) {
            if (!isAdminLoggedIn) return;
            if (confirm("Voulez-vous supprimer ce point ?")) {
                pingsData = pingsData.filter(p => p.id !== id);
                saveToCloud();
            }
        }

        function resetAllPings() {
            if (confirm("Voulez-vous remettre tous les pings en rouge pour préparer une nouvelle action ?")) {
                pingsData.forEach(p => p.status = 'pending');
                saveToCloud();
            }
        }

        function renderMapAndAdmin() {
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {};

            pingsData.forEach(ping => {
                let color = '#e74c3c';
                if (ping.status === 'assigned') color = '#27ae60';

                const iconHtml = `<div style="background:${color}; width:28px; height:28px; border-radius:50%; text-align:center; line-height:28px; color:white; font-size:13px; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3);">📍</div>`;
                const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [28, 28] });

                const popupHtml = `
                    <div style="max-width: 180px;">
                        <p style="font-size:0.8rem; font-weight:bold; color:${color};">👤 ${ping.pseudo}</p>
                        ${isAdminLoggedIn ? `
                            <div style="margin-top:6px; display:flex; flex-direction:column; gap:4px;">
                                <button onclick="togglePingStatus(${ping.id})" style="background:${ping.status === 'pending' ? '#27ae60' : '#e74c3c'}; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">${ping.status === 'pending' ? 'Marquer Trajet OK' : 'Remettre en rouge'}</button>
                                <button onclick="deletePing(${ping.id})" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">🗑️ Supprimer</button>
                            </div>
                        ` : ''}
                    </div>
                `;

                const marker = L.marker([ping.lat, ping.lng], { icon: customIcon }).addTo(map);
                marker.bindPopup(popupHtml);

                markersMap[ping.id] = marker;
            });

            if (isAdminLoggedIn) {
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';

            if (pingsData.length === 0) {
                list.innerHTML = '<p style="color:#888; font-size:0.85rem;">Aucun point actif.</p>';
                return;
            }

            pingsData.slice().reverse().forEach(ping => {
                const card = document.createElement('div');
                card.className = `ping-card ${ping.status}`;
                card.innerHTML = `
                    <p style="font-size:0.75rem; color:#666;"><b>${ping.pseudo}</b> (${ping.dateAdded})</p>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <button onclick="togglePingStatus(${ping.id})" class="btn-primary" style="padding:4px 8px; font-size:0.75rem; flex:1;">Changer couleur</button>
                        <button onclick="deletePing(${ping.id})" class="btn-danger" style="margin-top:0;">Supprimer</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        fetchFromCloud();
        setInterval(fetchFromCloud, 15000);
    </script>
</body>
</html>
