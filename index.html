<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énergisons Rennes - Carte Interactive</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 380px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .header {
            padding: 15px 20px;
            background: #1a1b41; /* Couleur proche du visuel Nouvelle Énergie */
            color: white;
            text-align: center;
        }

        .header img {
            max-height: 55px;
            width: auto;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .header p {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #dcdde1;
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-mode {
            flex: 1;
            padding: 10px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-mode.active {
            background: #3498db;
            color: white;
        }

        /* Tool Options */
        .tool-panel {
            display: none;
        }

        .tool-panel.active {
            display: block;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot.active {
            border-color: #333;
            transform: scale(1.15);
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }

        /* Bulletin Board List */
        .board-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        .board-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }

        .ping-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 5px solid #3498db;
            position: relative;
        }

        .ping-card.status-valid {
            border-left-color: #2ecc71;
        }

        .ping-card.status-expired {
            border-left-color: #e74c3c;
        }

        .ping-card .ping-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 6px;
        }

        .ping-card p {
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status-badge.valid {
            background: #e8f8f5;
            color: #27ae60;
        }

        .status-badge.expired {
            background: #fadbd8;
            color: #c0392b;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-action {
            padding: 6px 10px;
            font-size: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-colle {
            background: #2ecc71;
            color: white;
        }

        .btn-colle:hover {
            background: #27ae60;
        }

        .btn-refresh {
            background: #3498db;
            color: white;
        }

        .btn-refresh:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            margin-left: auto;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        /* Map Container */
        #map {
            flex: 1;
            width: 100%;
            height: 100vh;
        }

        .popup-content {
            font-family: inherit;
        }

        .popup-content p {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <!-- En-tête personnalisé avec le logo -->
        <div class="header">
            <img src="logo.png" alt="Logo Nouvelle Énergie">
            <p>Énergisons Rennes</p>
        </div>

        <div class="controls">
            <div class="mode-selector">
                <button class="btn-mode active" onclick="setMode('draw')">🖌️ Colorier</button>
                <button class="btn-mode" onclick="setMode('ping')">📌 Poster panneau</button>
            </div>

            <!-- Options Coloriage -->
            <div id="panel-draw" class="tool-panel active">
                <label>Couleur du tracé :</label>
                <div class="color-picker">
                    <div class="color-dot active" style="background: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
                    <div class="color-dot" style="background: #3498db;" onclick="setColor('#3498db', this)"></div>
                    <div class="color-dot" style="background: #2ecc71;" onclick="setColor('#2ecc71', this)"></div>
                    <div class="color-dot" style="background: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
                    <div class="color-dot" style="background: #9b59b6;" onclick="setColor('#9b59b6', this)"></div>
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">Cliquez sur 2 points de la carte pour tracer une ligne/rue.</p>
                <button onclick="clearDrawings()" style="margin-top: 10px; padding: 6px 12px; font-size: 0.8rem; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Effacer mes tracés</button>
            </div>

            <!-- Options Panneau -->
            <div id="panel-ping" class="tool-panel">
                <label for="ping-msg">Nom / Message du panneau :</label>
                <textarea id="ping-msg" rows="3" placeholder="Écrivez le nom ou le message du panneau, puis cliquez sur la carte..."></textarea>
            </div>
        </div>

        <!-- Liste des panneaux -->
        <div class="board-container">
            <div class="board-title">📋 Liste des panneaux</div>
            <div id="board-list"></div>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const DURATION_15_DAYS_MS = 15 * 24 * 60 * 60 * 1000;

        // Initialisation de la carte sur Rennes
        const map = L.map('map').setView([48.117266, -1.677792], 14);

        const osmFr = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France'
        });

        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        osmFr.addTo(map);

        L.control.layers({
            "OpenStreetMap Fr": osmFr,
            "Esri Street": esriStreet
        }).addTo(map);

        let currentMode = 'draw';
        let currentColor = '#e74c3c';
        let isDrawing = false;
        let currentPolyline = null;
        
        let pingsData = JSON.parse(localStorage.getItem('rennes_pings')) || [];
        let drawingsData = JSON.parse(localStorage.getItem('rennes_drawings')) || [];
        let markersMap = {};

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));

            if(mode === 'draw') {
                document.querySelectorAll('.btn-mode')[0].classList.add('active');
                document.getElementById('panel-draw').classList.add('active');
            } else {
                document.querySelectorAll('.btn-mode')[1].classList.add('active');
                document.getElementById('panel-ping').classList.add('active');
            }
        }

        function setColor(color, element) {
            currentColor = color;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            element.classList.add('active');
        }

        map.on('click', function(e) {
            if (currentMode === 'ping') {
                addPing(e.latlng);
            } else if (currentMode === 'draw') {
                handleDrawing(e.latlng);
            }
        });

        function handleDrawing(latlng) {
            if (!isDrawing) {
                isDrawing = true;
                currentPolyline = L.polyline([latlng], { color: currentColor, weight: 6, opacity: 0.8 }).addTo(map);
            } else {
                currentPolyline.addLatLng(latlng);
                saveDrawing(currentPolyline.getLatLngs(), currentColor);
                isDrawing = false;
                currentPolyline = null;
            }
        }

        function saveDrawing(latlngs, color) {
            drawingsData.push({ latlngs, color });
            localStorage.setItem('rennes_drawings', JSON.stringify(drawingsData));
        }

        function clearDrawings() {
            localStorage.removeItem('rennes_drawings');
            location.reload();
        }

        /* ----- GESTION DES PANNEAUX ----- */

        function addPing(latlng) {
            const msg = document.getElementById('ping-msg').value.trim();

            if (!msg) {
                alert("Veuillez saisir un nom ou message pour le panneau.");
                return;
            }

            const pingObj = {
                id: Date.now(),
                lat: latlng.lat,
                lng: latlng.lng,
                msg: msg,
                dateAdded: new Date().toLocaleDateString('fr-FR'),
                colleUntil: null
            };

            pingsData.push(pingObj);
            savePings();
            
            renderPingMarker(pingObj);
            updateBoard();
            document.getElementById('ping-msg').value = '';
        }

        function savePings() {
            localStorage.setItem('rennes_pings', JSON.stringify(pingsData));
        }

        function deletePing(id) {
            if (confirm("Voulez-vous vraiment supprimer ce panneau ?")) {
                pingsData = pingsData.filter(p => p.id !== id);
                savePings();
                
                if (markersMap[id]) {
                    map.removeLayer(markersMap[id]);
                    delete markersMap[id];
                }
                updateBoard();
            }
        }

        function validateColle(id) {
            const ping = pingsData.find(p => p.id === id);
            if (ping) {
                ping.colleUntil = Date.now() + DURATION_15_DAYS_MS;
                savePings();
                refreshPingDisplay(id);
            }
        }

        function refreshPingDisplay(id) {
            const ping = pingsData.find(p => p.id === id);
            if (ping && markersMap[id]) {
                markersMap[id].setPopupContent(buildPopupHtml(ping));
            }
            updateBoard();
        }

        function getStatusInfo(ping) {
            if (!ping.colleUntil) {
                return { status: 'none', label: '⚪ Non validé', cardClass: '' };
            }
            const now = Date.now();
            const diffMs = ping.colleUntil - now;
            
            if (diffMs > 0) {
                const daysLeft = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                const hoursLeft = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                return { 
                    status: 'valid', 
                    label: `✅ Affiche collée (${daysLeft}j ${hoursLeft}h restants)`, 
                    cardClass: 'status-valid' 
                };
            } else {
                return { 
                    status: 'expired', 
                    label: '⚠️ À recoller (Expiré)', 
                    cardClass: 'status-expired' 
                };
            }
        }

        function buildPopupHtml(ping) {
            const statusInfo = getStatusInfo(ping);
            let actionBtn = '';
            
            if (statusInfo.status === 'valid') {
                actionBtn = `<button class="btn-action btn-refresh" onclick="validateColle(${ping.id})">🔄 Relancer (+15j)</button>`;
            } else {
                actionBtn = `<button class="btn-action btn-colle" onclick="validateColle(${ping.id})">📌 Affiche collée</button>`;
            }

            return `
                <div class="popup-content">
                    <p><b>🪧 Panneau :</b><br>${ping.msg}</p>
                    <p style="font-size:0.8rem; color:#555;">${statusInfo.label}</p>
                    <div style="display:flex; gap:5px; margin-top:8px;">
                        ${actionBtn}
                        <button class="btn-action btn-delete" onclick="deletePing(${ping.id})">🗑️</button>
                    </div>
                </div>
            `;
        }

        function renderPingMarker(ping) {
            const statusInfo = getStatusInfo(ping);
            let bgColor = '#3498db';
            if (statusInfo.status === 'valid') bgColor = '#2ecc71';
            if (statusInfo.status === 'expired') bgColor = '#e74c3c';

            const iconHtml = `<div style="background:${bgColor}; width:32px; height:32px; border-radius:50%; text-align:center; line-height:32px; font-size:16px; color:white; box-shadow:0 2px 6px rgba(0,0,0,0.3); border:2px solid white;">🪧</div>`;
            const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [32, 32] });

            if (markersMap[ping.id]) {
                map.removeLayer(markersMap[ping.id]);
            }

            const marker = L.marker([ping.lat, ping.lng], { icon: customIcon }).addTo(map);
            marker.bindPopup(buildPopupHtml(ping));
            markersMap[ping.id] = marker;
        }

        function updateBoard() {
            const list = document.getElementById('board-list');
            list.innerHTML = '';
            
            if (pingsData.length === 0) {
                list.innerHTML = '<p style="color:#888; font-size:0.85rem;">Aucun panneau posé pour le moment.</p>';
                return;
            }

            pingsData.slice().reverse().forEach(ping => {
                const statusInfo = getStatusInfo(ping);
                const card = document.createElement('div');
                card.className = `ping-card ${statusInfo.cardClass}`;
                
                let actionBtnHtml = '';
                if (statusInfo.status === 'valid') {
                    actionBtnHtml = `<button class="btn-action btn-refresh" onclick="validateColle(${ping.id})">🔄 Relancer (+15j)</button>`;
                } else {
                    actionBtnHtml = `<button class="btn-action btn-colle" onclick="validateColle(${ping.id})">📌 Affiche collée</button>`;
                }

                card.innerHTML = `
                    <div class="ping-header">
                        <span>Créé le ${ping.dateAdded}</span>
                    </div>
                    <p><b>🪧</b> ${ping.msg}</p>
                    <div class="status-badge ${statusInfo.status}">${statusInfo.label}</div>
                    <div class="card-actions">
                        ${actionBtnHtml}
                        <button class="btn-action btn-delete" onclick="deletePing(${ping.id})">🗑️ Supprimer</button>
                    </div>
                `;
                list.appendChild(card);

                renderPingMarker(ping);
            });
        }

        function loadSavedData() {
            updateBoard();

            drawingsData.forEach(d => {
                L.polyline(d.latlngs, { color: d.color, weight: 6, opacity: 0.8 }).addTo(map);
            });
        }

        loadSavedData();
    </script>
</body>
</html>
